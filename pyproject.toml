[project]
name = "arkan-help"
version = "0.1.0"
description = "Contextual Help System for Frappe"
authors = [{name = "Arkan Lab", email = "dev@arkan.tech"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["frappe", "help", "documentation", "contextual-help", "onboarding"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Web Environment",
	"Framework :: Frappe",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: JavaScript",
]

[project.urls]
Homepage = "https://github.com/ArkanLab/arkan_help"
Repository = "https://github.com/ArkanLab/arkan_help"
Documentation = "https://github.com/ArkanLab/arkan_help/tree/main/docs"
Issues = "https://github.com/ArkanLab/arkan_help/issues"
Changelog = "https://github.com/ArkanLab/arkan_help/blob/main/CHANGELOG.md"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
	"B017",
	"B018",
	"B023",
	"B904",
	"E101",
	"E402",
	"E501",
	"E741",
	"F401",
	"F403",
	"F405",
	"F722",
	"W191",
	"UP030",
	"UP031",
	"UP032",
	"RUF001",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["arkan_help/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
	"slow: marks tests as slow",
	"integration: integration tests",
	"unit: unit tests",
]
