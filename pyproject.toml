[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "arkan_help"
version = "0.1.0"
description = "تطبيق المساعدة السياقية والتوثيق لإطار عمل فرابي"
readme = "README.md"
license = {text = "MIT"}
keywords = ["frappe", "help", "documentation", "contextual-help", "onboarding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Frappe",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
]
dependencies = [
    "frappe >=16.0.0",
    "frappe_visual",
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
frappe_visual = ""

[tool.ruff]
target-version = "py310"
lint.select = ["F", "E", "W", "I", "B", "RUF"]
lint.ignore = [
    "B017", # assertRaises(Exception)
    "B018", # useless expression
    "B023", # function definition in loop
    "B904", # raise from None
    "E101", # mixed tabs and spaces
    "E402", # module level import not at top
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # unused import
    "F403", # star import
    "F405", # may be undefined from star import
    "F722", # syntax error in forward annotation
    "W191", # indentation contains tabs
    "UP030", # implicit positional references
    "UP031", # percent format
    "UP032", # f-string vs format
    "RUF001", # ambiguous unicode
]
lint.typing-modules = ["frappe.types.df"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "unit: unit tests",
]
